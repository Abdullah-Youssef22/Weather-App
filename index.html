<!doctype html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <section class="searching-section">
            <form action="" class="searching-form">
                <div class="search-input-container">
                    <input
                    type="text"
                    class="city-name"
                    id="city-name"
                    placeholder="Enter city name"
                    autocomplete="off"
                    />

                    <div class="suggestions" id="suggestions"></div>
                </div>
                <button type="submit" class="btn submit-btn" id="submit-btn">
                    Get Weather
                </button>
            </form>
        </section>

        <section
            class="displaying-city-weather-section"
            id="displaying-city-weather-section"
        >
            <div class="current-data" id="current-data"></div>

            <div class="" id="forecast-contaner"></div>
        </section>

        <script type="module" src="./JS/dataManager.js"></script>
    </body>
</html>
